name: Full Campus CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_FEATURE_PROFILE: full-campus
      CAMPUS_DATA_MODE: mock
      ENABLE_DEMO_AUTH: "true"
      NUXT_PUBLIC_DEMO_MODE: "true"
      NUXT_PUBLIC_APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run lint
      - run: npm run check:no-ai
      - run: npm run check:dependencies
      - run: npm run typecheck
      - run: npm test
        # The API suite also protects retained full-campus modules. Individual
        # LMS MVP tests set lms-mvp explicitly, while legacy compatibility
        # tests must execute under the profile they exercise.
        env:
          APP_FEATURE_PROFILE: full-campus
      - run: npm run test:rules
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:full-campus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE: full-campus-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Build immutable LMS image
        run: |
          docker build \
            --build-arg APP_VERSION="${GITHUB_SHA}" \
            --build-arg APP_FEATURE_PROFILE=full-campus \
            --build-arg SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --file infra/Dockerfile \
            --tag "${APP_IMAGE}" \
            .
      - name: Start Nitro and Nginx
        run: |
          set -euo pipefail
          mkdir -p .ci-tls
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout .ci-tls/privkey.pem \
            -out .ci-tls/fullchain.pem \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo cp .ci-tls/fullchain.pem /usr/local/share/ca-certificates/lms-ci.crt
          sudo update-ca-certificates
          docker network create lms-ci
          docker run --detach --name app --network lms-ci \
            --env NODE_ENV=production \
            --env APP_VERSION="${GITHUB_SHA}" \
            --env APP_FEATURE_PROFILE=full-campus \
            --env CAMPUS_DATA_MODE=mock \
            --env ALLOW_PRODUCTION_MOCK=true \
            --env ENABLE_DEMO_AUTH=false \
            --env NUXT_PUBLIC_DEMO_MODE=false \
            "${APP_IMAGE}"
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' app)" = healthy ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs app
              exit 1
            fi
            sleep 2
          done
          docker run --detach --name nginx --network lms-ci \
            --publish 8080:80 \
            --publish 8443:443 \
            --env SERVER_NAME=localhost \
            --env NGINX_ENVSUBST_FILTER=SERVER_NAME \
            --volume "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/infra/nginx/conf.d/campus.conf:/etc/nginx/templates/default.conf.template:ro" \
            --volume "$PWD/.ci-tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro" \
            --volume "$PWD/.ci-tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro" \
            nginx:1.30.4-alpine
          for attempt in {1..30}; do
            if curl --silent --show-error --fail --cacert .ci-tls/fullchain.pem https://localhost:8443/nginx-health >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs nginx
              exit 1
            fi
            sleep 1
          done
          docker exec nginx nginx -t
          redirect_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/login)"
          test "$redirect_status" = 308
          pwsh -NoProfile -File scripts/smoke-production.ps1 -BaseUrl https://localhost:8443
      - name: Collect container logs
        if: failure()
        run: |
          docker logs app 2>&1 || true
          docker logs nginx 2>&1 || true
      - name: Remove smoke containers
        if: always()
        run: |
          docker rm --force nginx app 2>/dev/null || true
          docker network rm lms-ci 2>/dev/null || true
