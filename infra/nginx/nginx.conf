user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Deliberately log the normalized path ($uri), not query strings, request
    # bodies, cookies, or authorization headers.
    log_format campus_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout campus_json;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 4096;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # Dynamic/private responses are not compressed at the edge. Compression is
    # enabled only in the immutable public asset locations below, reducing the
    # risk of TLS compression side channels while retaining bandwidth savings.
    gzip off;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # GET/HEAD downloads are not counted against the write-oriented upload
    # limiter. An empty key is excluded from limit_req accounting.
    map $request_method $upload_limit_key {
        default $binary_remote_addr;
        GET "";
        HEAD "";
        OPTIONS "";
    }

    # Session reads share the normal API budget. Only state-changing auth
    # requests use the stricter auth budget, avoiding accidental lockout of a
    # campus behind one NAT address.
    map $request_method $auth_limit_key {
        default $binary_remote_addr;
        GET "";
        HEAD "";
        OPTIONS "";
    }

    limit_req_zone $binary_remote_addr zone=web_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    # Keep the edge burst budget aligned with the backend's coarse abuse
    # limiter. A lower per-IP budget can lock out many legitimate users when a
    # campus shares one public NAT address; the backend applies the stricter
    # post-verification budget per pseudonymous Firebase UID.
    limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=300r/m;
    limit_req_zone $upload_limit_key zone=upload_per_ip:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
